<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Hán Tự Việt – học tiếng Trung miễn phí theo chuẩn HSK 3.0: hơn 11.000 từ vựng HSK 1–9 có nghĩa tiếng Việt, nét bút, luyện viết, hội thoại, ngữ pháp, luyện nghe, thi thử HSK, luyện nói HSKK.">
<meta name="keywords" content="học tiếng Trung, HSK 3.0, từ vựng HSK, HSK 1, HSK 2, HSK 3, HSK 4, HSK 5, HSK 6, HSK 7-9, chữ Hán, nét bút, luyện viết chữ Hán, ngữ pháp tiếng Trung, HSKK">
<meta property="og:title" content="Hán Tự Việt – Học tiếng Trung theo chuẩn HSK 3.0">
<meta property="og:description" content="Từ vựng HSK 1–9 nghĩa tiếng Việt, nét bút, hội thoại, ngữ pháp, thi thử HSK miễn phí.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://le-hye.github.io/hantuviet/">
<link rel="canonical" href="https://le-hye.github.io/hantuviet/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23f0506e'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white'%3E汉%3C/text%3E%3C/svg%3E">
<title>Hán Tự Việt – Tra chữ Hán HSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070d1a;--bg2:#0d1526;--card:#111a2e;--card2:#16213a;--line:#22304d;--line2:#2c3d60;
  --tx:#e8eefb;--tx2:#a9b6d0;--tx3:#71809f;
  --pri:#3b6cf6;--pri2:#6f95ff;--red:#f0506e;--red2:#ff7a90;--org:#f97316;--yel:#f5b83d;--grn:#2fbf8f;--pur:#8b7cf6;--cyan:#38bdf8;
  --hz:"Noto Serif SC","Noto Sans SC",serif;--r:16px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
[data-theme=light]{
  --bg:#f3f6fc;--bg2:#ffffff;--card:#ffffff;--card2:#f6f8fd;--line:#e1e7f2;--line2:#cfd8ea;
  --tx:#14203a;--tx2:#4b5a78;--tx3:#8391ad;--shadow:0 10px 30px -16px rgba(30,50,90,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:80px;
  background-image:radial-gradient(900px 400px at 10% -10%,rgba(59,108,246,.12),transparent),radial-gradient(700px 400px at 100% 0,rgba(240,80,110,.08),transparent)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
.hz{font-family:var(--hz)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{max-width:1580px}
.row1{display:flex;align-items:center;gap:10px;height:66px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-right:auto;cursor:pointer}
.logo-mark{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--org));display:grid;place-items:center;font-family:var(--hz);font-size:24px;color:#fff;font-weight:700;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 6px 18px -6px rgba(240,80,110,.7)}
.logo b{font-size:27px;font-weight:800;letter-spacing:-.8px;display:block;line-height:1;background:linear-gradient(90deg,#4f8cff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-size:13px;color:var(--tx2);display:block;margin-top:3px;font-weight:500}
.r1{display:flex;align-items:center;gap:8px}
.hb{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap;transition:.15s}
.hb:hover{border-color:var(--pri2)}
.hb.sq{width:42px;padding:0;justify-content:center;font-size:18px;background:var(--card2)}
.hb.ghost{border-color:transparent;background:none;color:var(--tx2);font-weight:500}
.hb.ghost:hover{color:var(--tx)}
.h-pur{border-color:rgba(168,85,247,.45);background:rgba(168,85,247,.12);color:#d8b4fe}
.h-cyan{border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.1);color:#7dd3fc}
.h-org{border-color:rgba(249,115,22,.45);background:rgba(249,115,22,.12);color:#fdba74}
.h-org .sep{width:1px;height:16px;background:rgba(249,115,22,.5)}
.h-org .gold{color:var(--yel)}
.h-out{border-color:var(--pri2);color:var(--pri2);background:none}
.h-blue{background:linear-gradient(135deg,#2f80ff,#1d6bf0);border-color:transparent;color:#fff}
[data-theme=light] .h-pur{color:#7e22ce}[data-theme=light] .h-cyan{color:#0369a1}[data-theme=light] .h-org{color:#c2410c}
.bdg{font-style:normal;font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:5px;color:#fff;letter-spacing:.3px}
.bdg.pink{background:linear-gradient(90deg,#a855f7,#ec4899)}
.bdg.red{background:#ef4444}
.vsep{width:1px;height:24px;background:var(--line2);margin:0 2px}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60}
.ddm.right{left:auto;right:0}
.dd:hover .ddm,.dd:focus-within .ddm,.dd.open .ddm{display:block}
.dd:before{content:"";position:absolute;left:0;right:0;top:100%;height:8px}
.ddm button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;text-align:left;font-size:14px;font-weight:500}
.ddm button:hover{background:var(--card2)}
.ddm button small{margin-left:auto;font-size:11px;color:var(--tx3)}
.ddm .hd{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.6px;padding:6px 11px 2px;text-transform:uppercase}
.r2wrap{position:relative;max-width:1580px;margin:0 auto}
.row2{display:flex;align-items:center;gap:4px;height:54px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding:0 16px}
.row2>*{flex-shrink:0}
.row2 .ddm{position:fixed}
.r2btn{position:absolute;top:0;bottom:0;width:44px;display:none;align-items:center;z-index:2;font-size:18px;color:var(--tx)}
.r2btn.l{left:0;justify-content:flex-start;padding-left:6px;background:linear-gradient(90deg,var(--bg) 55%,transparent)}
.r2btn.r{right:0;justify-content:flex-end;padding-right:6px;background:linear-gradient(270deg,var(--bg) 55%,transparent)}
.r2btn.on{display:flex}
.row2::-webkit-scrollbar{display:none}
.nv{height:38px;padding:0 10px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--tx);white-space:nowrap;border:1px solid transparent}
.nv:hover{background:var(--card2)}
.nv .car{font-size:10px;opacity:.6}
.nv.on{background:rgba(59,108,246,.16);color:var(--pri2);border-color:rgba(59,108,246,.35)}
.nv.n-blue{background:rgba(59,108,246,.16);color:var(--pri2)}
.nv.n-org{border-color:rgba(249,115,22,.5);background:rgba(249,115,22,.12);color:#fdba74}
.nv.n-ind{border-color:rgba(111,149,255,.5);background:rgba(111,149,255,.12)}
.nv.n-gold{border-color:rgba(245,184,61,.6);background:linear-gradient(135deg,rgba(245,184,61,.25),rgba(249,115,22,.2));color:var(--yel)}
[data-theme=light] .nv.n-org{color:#c2410c}[data-theme=light] .nv.n-gold{color:#a16207}
.burger,.msearch{display:none}
.authA{display:contents}
.user{display:inline-flex;align-items:center;gap:8px}
.ava{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
/* palette */
.pal{position:fixed;inset:0;background:rgba(3,7,16,.6);backdrop-filter:blur(4px);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:80px 16px 16px}
.pal.on{display:flex}
.palbox{width:100%;max-width:600px;padding:12px}
.search{position:relative}
.search input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);padding:0 60px 0 44px;outline:none;font-size:16px}
.search input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,108,246,.2)}
.search svg{position:absolute;left:15px;top:16px;color:var(--tx3)}
.search kbd,.kbd{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--tx3);font-family:inherit;background:var(--card2)}
.search kbd{position:absolute;right:12px;top:15px}
.drop{max-height:60vh;overflow:auto;padding-top:8px}
.drop a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer;text-decoration:none;color:inherit}
.drop a:hover,.drop a.act{background:var(--card2)}
.drop .dc{font-family:var(--hz);font-size:26px;width:40px;text-align:center;color:var(--red2)}
.drop .dm{font-size:13px;color:var(--tx2)}
.drop .empty{padding:14px;color:var(--tx3);font-size:14px}
/* drawer */
.drawer{position:fixed;inset:0;z-index:75;display:none}
.drawer.on{display:block}
.drawer .bg{position:absolute;inset:0;background:rgba(3,7,16,.6)}
.drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(330px,88vw);background:var(--card);border-left:1px solid var(--line2);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.drawer .pn>*{flex-shrink:0}
.drawer .pn .hb{width:100%;justify-content:flex-start;height:44px}
.drawer .pn .hb.sq{width:42px;justify-content:center}
.drawer .pn .hd{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.6px;margin:10px 4px 2px}
.field{display:block;margin-top:12px}
.field span{font-size:13px;color:var(--tx2);font-weight:600}
.field input,.field textarea{width:100%;margin-top:5px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);padding:11px 13px;outline:none;font:inherit;color:inherit}
.field input:focus,.field textarea:focus{border-color:var(--pri)}
.note{font-size:12.5px;color:var(--tx3);margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--card2)}
.plan{border:1px solid var(--line2);border-radius:14px;padding:14px;margin-top:10px}
.plan.best{border-color:var(--yel);background:rgba(245,184,61,.06)}
.rk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card2);margin-top:8px}
.rk b.big{font-size:22px}
.trout{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.trw{border:1px solid var(--line2);border-radius:12px;padding:6px 10px;text-align:center;background:var(--card2);cursor:pointer}
.trw .hz{font-size:24px;display:block}
.trw small{display:block;font-size:11.5px;color:var(--tx2)}
.trw.unk{opacity:.5;cursor:default}
.radg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:30px}
.radc{padding:14px}
.radc .top2{display:flex;align-items:center;gap:10px}
.radc .top2 .hz{font-size:40px;color:var(--yel);width:52px;text-align:center}
[data-theme=light] .radc .top2 .hz{color:#b07a06}
.radc .chs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.radc .chs span{font-family:var(--hz);font-size:22px;padding:2px 8px;border-radius:8px;background:var(--card2);cursor:pointer;color:var(--red2)}
.soonbox{text-align:center;padding:10px 0}
.soonbox .ic{font-size:54px}
@media (max-width:1520px){.hb{padding:0 10px;font-size:13.5px}}
@media (max-width:1400px){.r1 .lg-only{display:none}}


@media (max-width:1100px){.r1 .md-hide{display:none}}
@media (max-width:1024px){
  .r1>*:not(.keep){display:none}
  .burger,.msearch{display:inline-flex}
  .row2{height:48px;padding:0 8px}.nv{font-size:13.5px;height:34px}
  .logo b{font-size:22px}
}
/* crumb */
.crumb{margin:18px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb .path{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:14px;flex:1;min-width:0}
.crumb .path a{color:var(--tx3);text-decoration:none;cursor:pointer}
.crumb .path a:hover{color:var(--tx)}
.crumb .path b{color:var(--tx)}
.pill{height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.pill:hover{border-color:var(--pri2)}
.pill.blue{background:var(--pri);border-color:var(--pri);color:#fff}
.pill:disabled{opacity:.4;cursor:default}

/* hero */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.hero{padding:22px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.hl{display:flex;flex-direction:column}
.hl-top{display:flex;gap:20px;align-items:flex-start}
.bigc{width:124px;height:124px;flex-shrink:0;border-radius:18px;border:1px solid rgba(240,80,110,.35);background:
  linear-gradient(rgba(240,80,110,.18),rgba(240,80,110,.18)) center/100% 1px no-repeat,
  linear-gradient(rgba(240,80,110,.18),rgba(240,80,110,.18)) center/1px 100% no-repeat,
  linear-gradient(160deg,#3a1420,#1c0e18);display:grid;place-items:center;font-family:var(--hz);font-size:84px;color:var(--red2);font-weight:700;cursor:pointer;position:relative;transition:.2s}
[data-theme=light] .bigc{background:linear-gradient(rgba(240,80,110,.2),rgba(240,80,110,.2)) center/100% 1px no-repeat,linear-gradient(rgba(240,80,110,.2),rgba(240,80,110,.2)) center/1px 100% no-repeat,linear-gradient(160deg,#fff1f4,#ffe4ea);color:#d6294c}
.bigc:hover{transform:scale(1.03)}
.pyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.py{font-size:34px;font-weight:500;letter-spacing:.5px}
.lv{background:var(--pur);color:#fff;font-weight:700;font-size:13px;padding:4px 11px;border-radius:99px}
.au{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--tx2)}
.au:hover{color:var(--tx);border-color:var(--pri2)}
.au svg{color:var(--red2)}
.mean{font-size:21px;font-weight:600;margin-top:14px;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:18px;border-top:1px dashed var(--line2)}
.chip{font-size:14px;padding:5px 12px;border-radius:9px;border:1px solid;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:700}
.c-red{border-color:rgba(240,80,110,.4);background:rgba(240,80,110,.08);color:var(--red2)}
.c-yel{border-color:rgba(245,184,61,.4);background:rgba(245,184,61,.08);color:var(--yel)}
.c-grn{border-color:rgba(47,191,143,.4);background:rgba(47,191,143,.08);color:var(--grn)}
.c-blu{border-color:rgba(111,149,255,.4);background:rgba(111,149,255,.08);color:var(--pri2)}
[data-theme=light] .c-yel{color:#b07a06}[data-theme=light] .c-grn{color:#178a63}
.hr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:13px 14px;min-height:118px}
.box h4{font-size:12.5px;letter-spacing:.6px;color:var(--tx2);font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.box h4 span{background:rgba(59,108,246,.18);color:var(--pri2);border-radius:99px;padding:1px 9px;font-size:12px;text-transform:none;letter-spacing:0}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini svg{width:32px;height:32px;border-radius:8px;border:1px solid rgba(240,80,110,.3);background:rgba(240,80,110,.06)}
.mini .more{font-size:12px;color:var(--tx3);align-self:center}
.muted{color:var(--tx3);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9px;border:1px solid rgba(245,184,61,.35);background:rgba(245,184,61,.08);font-size:13.5px;color:var(--yel);font-weight:600}
.tag .hz{font-size:16px}
[data-theme=light] .tag{color:#9a6a00}
.tag.link{cursor:pointer;border-color:rgba(111,149,255,.4);background:rgba(111,149,255,.1);color:var(--pri2)}
.tools{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.tools .lbl{font-weight:700;font-size:13.5px;letter-spacing:.5px;color:var(--tx2);margin-right:auto}
.tb{height:44px;padding:0 16px;border-radius:12px;border:1px solid;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;transition:.15s}
.tb:hover{transform:translateY(-1px)}
.t1{border-color:rgba(240,80,110,.45);color:var(--red2);background:rgba(240,80,110,.07)}
.t1.on{background:var(--red);color:#fff}
.t2{border-color:rgba(111,149,255,.45);color:var(--pri2);background:rgba(111,149,255,.07)}
.t3{border-color:rgba(249,115,22,.45);color:#fb923c;background:rgba(249,115,22,.07)}
.t4{border-color:rgba(139,124,246,.45);color:#a598ff;background:rgba(139,124,246,.07)}
.t5{border-color:rgba(47,191,143,.45);color:var(--grn);background:rgba(47,191,143,.07)}

/* tabs */
.tabs{margin:18px 0;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;color:var(--tx2);font-size:15px}
.tab:hover{color:var(--tx)}
.tab.on{background:linear-gradient(135deg,var(--pri),#2f5be0);color:#fff;box-shadow:0 8px 20px -8px rgba(59,108,246,.8)}
.tab .k{background:rgba(255,255,255,.12);border-radius:99px;padding:0 9px;font-size:13px}
.tab:not(.on) .k{background:var(--card2)}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:18px}
.sec{padding:20px}
.sec>h3{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec>h3 svg{color:var(--pri2)}
.sec>h3 .r{margin-left:auto;display:flex;gap:6px}
.tree{display:flex;gap:24px;align-items:center}
.troot{width:110px;height:120px;border-radius:16px;background:linear-gradient(160deg,var(--org),#ea580c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 12px 26px -10px rgba(249,115,22,.7)}
.troot .hz{font-size:50px;line-height:1.1}
.troot i{font-size:12px;opacity:.9}
.troot small{font-size:11.5px;opacity:.9;text-align:center;padding:0 6px}
.tnodes{display:flex;flex-direction:column;gap:12px;flex:1;position:relative;padding-left:18px;border-left:2px solid var(--line2)}
.tnode{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);position:relative}
.tnode:before{content:"";position:absolute;left:-20px;top:50%;width:18px;border-top:2px solid var(--line2)}
.tnode .hz{font-size:32px;color:var(--yel);width:40px;text-align:center}
[data-theme=light] .tnode .hz{color:#c48400}
.tnode b{font-size:15px}
.tnode .pb{font-size:11.5px;font-style:italic;color:var(--yel);border:1px solid rgba(245,184,61,.4);border-radius:99px;padding:0 8px;margin-left:6px}
.tnode p{font-size:13.5px;color:var(--tx2)}

.mems{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mem{border:1px solid var(--line2);border-radius:14px;padding:12px;text-align:center;background:var(--card2);display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.mem.spk{border-color:var(--grn);box-shadow:0 0 0 3px rgba(47,191,143,.3)}
.mem .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#a855f7);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800}
.mem small{color:var(--tx3);font-size:11.5px}
.chatb{display:flex;flex-direction:column;min-height:460px}
.chat{flex:1;overflow:auto;max-height:420px;display:flex;flex-direction:column;gap:8px;padding:4px}
.cm{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}.cm b{font-size:12px;color:var(--pri2)}
.cm.me{margin-left:auto;background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3)}
.cs{text-align:center;color:var(--tx3);font-size:12.5px}
.chf{display:flex;gap:8px;margin-top:10px}.chf input{flex:1;height:42px}
@media (max-width:860px){.rmg{grid-template-columns:1fr}.mk{flex-direction:column;align-items:flex-start}}

/* ===== thư viện chép chính tả ===== */
.dtabs{display:flex;gap:6px;padding:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.dtabs button{height:44px;padding:0 18px;border-radius:12px;font-weight:700;color:var(--tx2);white-space:nowrap;display:flex;align-items:center;gap:8px}
.dtabs button.on{background:linear-gradient(135deg,#0ea5e9,#2f80ff);color:#fff}
.dtabs.st .s-done{color:var(--grn)}.dtabs.st .s-doing{color:#fb923c}.dtabs.st button.on{color:#fff}
.nb2{background:rgba(255,255,255,.12);border-radius:99px;padding:0 8px;font-size:12px}
.dgh{display:flex;align-items:center;gap:12px;margin:22px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.lvp{color:#fff;font-weight:800;padding:5px 14px;border-radius:99px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.dcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);cursor:pointer;transition:.18s}
.dcard:hover{transform:translateY(-3px);border-color:var(--pri2)}
.dthumb{height:180px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.demo{font-size:58px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}.demo.big{font-size:84px}
.dbub{background:#fff;color:#14203a;padding:6px 14px;border-radius:14px;font-size:18px;box-shadow:0 6px 16px rgba(0,0,0,.25);max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dst{position:absolute;left:12px;top:12px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(15,23,42,.75);color:#e2e8f0}
.dst.done{background:#16a34a;color:#fff}.dst.doing{background:#f97316;color:#fff}
.dfree{position:absolute;right:12px;top:12px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:#22c55e;color:#fff}
.dlen{position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;background:rgba(15,23,42,.7);color:#fff}
.dbody{padding:14px 16px;display:flex;flex-direction:column;gap:4px}.dbody b{font-size:16px}
.dft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:8px;font-size:13.5px;gap:8px}
.dft .lnk{font-weight:700;white-space:nowrap}
.dlay{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:24px;align-items:start}
.dplayer{height:300px;border-radius:16px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.dsub{background:rgba(15,23,42,.78);color:#fff;padding:10px 18px;border-radius:12px;font-size:22px;max-width:90%;text-align:center}
.dprog{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.25)}.dprog i{display:block;height:100%;background:#fff}
.ytw{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden}.ytw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dbox{margin-top:16px;border:1px solid var(--line2);border-radius:14px;padding:14px;background:var(--card2)}
.dta{width:100%;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:12px;font-family:var(--hz);font-size:22px;color:var(--tx);outline:none;resize:vertical}
.dta:focus{border-color:var(--pri)}
.dres2{margin-top:12px}.dcmp{font-size:26px;letter-spacing:2px;margin:6px 0}
.dk{color:var(--grn)}.dx{color:#fff;background:var(--red);border-radius:4px;padding:0 2px}
.dlines{display:flex;flex-direction:column;gap:6px;max-height:620px;overflow:auto}
.dl2{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.dl2.cur{border-color:var(--pri2);background:rgba(59,108,246,.1)}.dl2 .hz{font-size:17px}
.dl2 .no{width:24px;height:24px;border-radius:7px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
@media (max-width:860px){.dlay{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}.dplayer{height:220px}}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const store={get(k,d){try{const v=localStorage.getItem("htv_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("htv_"+k,JSON.stringify(v))}catch(e){}}};
const IDX={};DICT.forEach((d,i)=>IDX[d.c]=i);
const strip=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ü/g,"v").toLowerCase();
const plain=s=>strip(s).replace(/[^a-z]/g,"");
let state={tab:store.get("tab",0),py:true,vi:true,en:true};
let notes=store.get("notes",[]);
let writer=null,qwriter=null;

/* ---------- speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/zh|cmn/i.test(v.lang))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speak(text,opt={}){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=opt.slow?0.55:0.85;
    const cn=voices.filter(v=>/CN|cmn/i.test(v.lang));const pool=cn.length?cn:voices;
    if(pool.length){
      const male=pool.find(v=>/male|男|yunxi|yunyang|kangkang|liang|nan/i.test(v.name)&&!/female/i.test(v.name));
      const female=pool.find(v=>/female|女|xiaoxiao|huihui|yaoyao|ting|li-mu|meijia/i.test(v.name));
      u.voice=opt.male?(male||pool[pool.length-1]):(female||pool[0]);
    }
    u.pitch=opt.male?0.75:1.15;
    speechSynthesis.speak(u);
  }catch(e){toast("Trình duyệt này chưa hỗ trợ đọc tiếng Trung")}
}
const ICO_SP='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- stroke svg ---------- */
function strokeSvg(ch,upto,hi){
  const d=STROKES[ch];if(!d)return"";
  let p="";
  d.strokes.forEach((s,i)=>{
    const col=i===hi?"var(--red)":(i<upto?"var(--tx)":"var(--line2)");
    p+=`<path d="${s}" fill="${col}"/>`;
  });
  return `<svg viewBox="0 0 1024 1024"><g transform="translate(0,900) scale(1,-1)">${p}</g></svg>`;
}
const GRID=`<svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none"><g stroke="rgba(240,80,110,.25)" stroke-width=".4" stroke-dasharray="1.5 1.5"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></g></svg>`;

/* ---------- routing ---------- */
function go(r){if(location.hash==="#"+r)render();else location.hash=r}
function cur(){const m=location.hash.match(/^#c-(\d+)$/);return m&&DICT[+m[1]]?+m[1]:-1}
window.addEventListener("hashchange",render);

function render(){
  try{speechSynthesis.cancel()}catch(e){}
  const i=cur();
  document.querySelectorAll(".bnav button").forEach(b=>b.classList.toggle("on",b.dataset.b==="home"&&i<0));
  closeDrawer();closePal();
  const h=location.hash.slice(1);let m;
  if(typeof TK!=="undefined"&&TK.room&&h!=="phong-"+TK.room.code)leaveRoom(true);
  if(h==="radicals")renderRadicals();
  else if(h==="phongnoi")renderLobby();
  else if(h==="chinhta")renderDLib();
  else if(m=h.match(/^ct-(.+)$/))renderDLesson(decodeURIComponent(m[1]));
  else if(m=h.match(/^phong-(TALK-\d+)$/i))renderRoom(m[1].toUpperCase());
  else if(m=h.match(/^tv-(\d)$/))renderVocabList(m[1]);
  else if(m=h.match(/^w-(\d)-(\d+)$/))renderWord(m[1],+m[2]);
  else if(h==="hskk")renderHSKK();
  else if(h==="nghe6")renderListenList();
  else if(m=h.match(/^nghe6-(\d+)$/))renderListen(+m[1]);
  else if(h==="hoithoai")renderConvList(1);
  else if(m=h.match(/^hoithoai-(\d)$/))renderConvList(m[1]);
  else if(m=h.match(/^ht-(\d)-(\d+)$/))renderConv(m[1],+m[2]);
  else if(m=h.match(/^ht-(\d+)$/))renderConv(1,+m[1]);
  else if(h==="giaotrinh")renderCourse();
  else if(m=h.match(/^lop-(\d)$/))renderCourse3(m[1]);
  else if(m=h.match(/^lop-(\d)-(\d+)$/))renderLesson3(m[1],+m[2]);
  else if(m=h.match(/^bai-(\d+)$/))renderLesson(+m[1]);
  else if(m=h.match(/^nguphap-(\d)$/))renderGrammar(m[1]);
  else if(h==="dochieu")renderReading();
  else if(h==="luyenthi")renderExamHub();
  else if(i<0)renderHome();else renderChar(i);
  buildNav();window.scrollTo({top:0});
}

/* ---------- home ---------- */
let homeFilter="all";
const cumV=l=>LVS.filter(x=>+x<=+l).reduce((a,x)=>a+VOCAB[x].length,0);
const cumG=l=>LVS.filter(x=>+x<=+l).reduce((a,x)=>a+LV_INFO[x].goal,0);
function renderHome(){
  const list=DICT.map((d,i)=>[d,i]).filter(([d])=>homeFilter==="all"||(homeFilter==="saved"&&notes.includes(d.c)));
  const today=DICT[new Date().getDate()%DICT.length];
  const nV=LVS.reduce((a,l)=>a+VOCAB[l].length,0),nG=Object.values(GRAMMAR).reduce((a,g)=>a+g.length,0);
  $("#app").innerHTML=`
  <div class="hhead"><div><h1>Học tiếng Trung theo giáo trình</h1><p>${nV} từ vựng HSK 1–9 · ${CONVS[1].length+CONVS[2].length+CONVS[3].length} bài hội thoại HSK 1–3 · theo chuẩn HSK 3.0 · ${nG} điểm ngữ pháp · ${HSKK.length} đề HSKK · ${LISTEN6.length} bài nghe HSK 6</p></div></div>
  <div class="lvgrid">${LVS.map(l=>`<div class="card lvc" onclick="TV={q:'',les:'',n:60};go('tv-${l}')" style="--c:${LV_INFO[l].c}"><b>${LV_INFO[l].n}</b><div class="big">${cumV(l).toLocaleString("vi-VN")}</div><small>từ tích lũy (chuẩn ${cumG(l).toLocaleString("vi-VN")})</small><small>+${VOCAB[l].length} từ mới của cấp</small><span>Học ngay →</span><span style="margin-top:2px" onclick="event.stopPropagation();go('lop-${l}')">📘 ${LESSONS[l].length} bài HSK 3.0 →</span></div>`).join("")}</div><div class="lvgrid lv2">
   <div class="card lvc" onclick="go('hoithoai')" style="--c:#2fbf8f"><b>Hội thoại</b><div class="big">${CONVS[1].length+CONVS[2].length+CONVS[3].length}</div><small>bài HSK 1–3</small><span>Nghe & nhập vai →</span></div>
   <div class="card lvc" onclick="go('nguphap-1')" style="--c:#f5b83d"><b>Ngữ pháp</b><div class="big">${nG}</div><small>điểm HSK 1–5</small><span>Xem →</span></div>
   <div class="card lvc" onclick="openSpeak()" style="--c:#a855f7"><b>Luyện nói</b><div class="big">2</div><small>phần: một mình · phòng trực tuyến</small><span>Vào luyện nói →</span></div>
   <div class="card lvc" onclick="go('nghe6')" style="--c:#38bdf8"><b>Nghe hiểu HSK 6</b><div class="big">${LISTEN6.reduce((a,o)=>a+o.p.length,0)}</div><small>đoạn nghe</small><span>Nghe →</span></div>
   <div class="card lvc" onclick="go('luyenthi')" style="--c:#f0506e"><b>Thi thử</b><div class="big">20</div><small>câu / đề</small><span>Làm đề →</span></div></div>
  <div class="hhead" style="margin-top:8px"><div><h1 style="font-size:22px">Chữ Hán phân tích chi tiết</h1><p>${DICT.length} chữ có chiết tự, mẹo nhớ, hình minh họa</p></div>
   <div class="hfil"><button class="pill ${homeFilter==="all"?"blue":""}" onclick="homeFilter='all';renderHome()">Tất cả</button><button class="pill ${homeFilter==="saved"?"blue":""}" onclick="homeFilter='saved';renderHome()">⭐ Đã lưu (${notes.length})</button></div></div>
  <div class="card banner"><div class="hz">${today.c}</div><div style="flex:1"><small class="muted">CHỮ CỦA NGÀY</small><h2>${today.py} · ${today.hv} – ${esc(today.defs[0].vi)}</h2><p>${esc(today.tip)}</p></div><button class="pill blue" onclick="go('c-${IDX[today.c]}')">Học ngay →</button></div>
  <div class="cgrid">${list.length?list.map(([d,i])=>`<div class="card cc" onclick="go('c-${i}')">${notes.includes(d.c)?'<span class="s">★</span>':""}<div class="hz">${d.c}</div><div class="p">${d.py}</div><div class="m">${esc(d.defs[0].vi.split(/[,(;]/)[0])}</div></div>`).join(""):`<p class="muted">Chưa lưu chữ nào. Bấm “Lưu sổ tay” ở trang chữ để thêm.</p>`}</div>`;
  document.title="Hán Tự Việt – Tra chữ Hán HSK";
}

/* ---------- character page ---------- */
function renderChar(i){
  const d=DICT[i],st=STROKES[d.c],n=st.strokes.length;
  const homo=DICT.filter(x=>x.c!==d.c&&plain(x.py)===plain(d.py));
  const exCount=d.defs.reduce((a,x)=>a+x.ex.length,0);
  const saved=notes.includes(d.c);
  document.title=`${d.c} (${d.py}) – ${d.hv} | Hán Tự Việt`;
  const minis=[];for(let k=0;k<Math.min(n,12);k++)minis.push(strokeSvg(d.c,k,k));
  $("#app").innerHTML=`
  <div class="crumb">

const loader=(ch,ok,err)=>STROKES[ch]?ok(STROKES[ch]):err&&err();
function hwColors(){const l=document.documentElement.dataset.theme==="light";return{strokeColor:l?"#14203a":"#e8eefb",radicalColor:"#f0506e",outlineColor:l?"#d9e0ee":"#2a3858",highlightColor:"#38bdf8",drawingColor:"#3b6cf6"}}
let stepI=0,looping=false;
function mountWriter(ch){
  const el=$("#hw");if(!el||!window.HanziWriter)return;
  const size=el.clientWidth||300;
  writer=HanziWriter.create(el,ch,{width:size,height:size,padding:18,charDataLoader:loader,showOutline:true,strokeAnimationSpeed:1.1,delayBetweenStrokes:250,...hwColors()});

}
function loopAnim(){if(!writer)return;looping=!looping;if(looping)writer.loopCharacterAnimation();else{writer.pauseAnimation();writer.showCharacter()}}
function stepAnim(){if(!writer)return;const n=STROKES[DICT[cur()].c].strokes.length;if(stepI===0||stepI>=n){writer.hideCharacter();stepI=0}writer.animateStroke(stepI);stepI++}

function startQuiz(ch,outline){if(!STROKES[ch]){needStrokes([ch],()=>startQuiz(ch,outline));return}

    onMistake:s=>{$("#wmsg").textContent=`❌ Chưa đúng nét ${s.strokeNum+1}, thử lại nhé`},

/* quiz: chọn nghĩa / pinyin */
let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function openQuiz(focus){
  const pool=shuffle(DICT);let qs=pool.slice(0,8);
  if(focus){qs=qs.filter(x=>x.c!==focus);qs.unshift(DICT[IDX[focus]]);qs=qs.slice(0,8)}
  Q={qs,k:0,score:0,mode:"read"};nextQ();
}
function openListen(){Q={qs:shuffle(DICT).slice(0,8),k:0,score:0,mode:"listen"};nextQ()}
function nextQ(){
  if(Q.k>=Q.qs.length){openModal(`<h3>🏆 Kết quả</h3><div class="qq" style="font-family:inherit;font-size:54px;font-weight:800">${Q.score}/${Q.qs.length}</div><p style="text-align:center" class="muted">${Q.score===Q.qs.length?"Xuất sắc! Bạn nhớ hết rồi.":Q.score>=Q.qs.length/2?"Khá lắm, ôn thêm một chút nữa nhé.":"Cố lên, hãy xem lại các chữ bên dưới."}</p><div class="ctl" style="justify-content:center"><button class="pill blue" onclick="${Q.mode==="listen"?"openListen()":"openQuiz()"}">Làm lại</button><button class="pill" onclick="closeModal()">Đóng</button></div>`);return}
  const d=Q.qs[Q.k];const type=Q.mode==="listen"?2:Q.k%2;
  const wrong=shuffle(DICT.filter(x=>x.c!==d.c)).slice(0,3);const opts=shuffle([d,...wrong]);
  const label=x=>type===0?esc(x.defs[0].vi.split(/[(;]/)[0]):type===1?x.py+" · "+x.hv:`<span class="hz" style="font-size:26px">${x.c}</span> &nbsp;${esc(x.defs[0].vi.split(/[,(;]/)[0])}`;
  openModal(`<h3>${Q.mode==="listen"?"🎧 Luyện nghe":"🎯 Luyện tập"} · Câu ${Q.k+1}/${Q.qs.length}</h3><div class="qbar"><i style="width:${Q.k/Q.qs.length*100}%"></i></div>
   ${type===2?`<div style="text-align:center;margin:18px 0"><button class="tb t2" style="height:64px;font-size:18px" onclick="speak('${d.c}')">${ICO_SP} Nghe lại</button></div><p class="muted" style="text-align:center">Chọn chữ bạn vừa nghe</p>`:`<div class="qq">${d.c}</div><p class="muted" style="text-align:center">${type===0?"Chữ này có nghĩa là gì?":"Chữ này đọc là gì?"}</p>`}
   ${opts.map(o=>`<button class="qopt" data-c="${o.c}" onclick="ans(this,'${d.c}')">${label(o)}</button>`).join("")}`);
  if(type===2)setTimeout(()=>speak(d.c),250);
}
function ans(btn,c){
  document.querySelectorAll(".qopt").forEach(b=>{b.disabled=true;if(b.dataset.c===c)b.classList.add("ok")});
  if(btn.dataset.c===c){Q.score++;addPts(10)}else btn.classList.add("no");
  speak(c);Q.k++;setTimeout(nextQ,1100);
}

function toggleNote(c){const i=notes.indexOf(c);if(i<0){notes.push(c);toast("Đã lưu “"+c+"” vào sổ tay")}else{notes.splice(i,1);toast("Đã bỏ “"+c+"” khỏi sổ tay")}store.set("notes",notes);updBadge();if($("#mask").classList.contains("on"))openNotes();else render()}

  ${notes.length?notes.map(c=>{const x=WIDX[c],v=x?VOCAB[x[0]][x[1]]:null,d=IDX[c]!=null?DICT[IDX[c]]:null;const py=d?d.py:v?v[1]:"",m=d?d.defs[0].vi:v?v[3]:"";return `<div class="nb" onclick="closeModal();goWord('${c}')"><span class="hz">${c}</span><div><b>${py}</b>${d?" · "+d.hv:""}<div class="muted">${esc(m)}</div></div><button class="del" onclick="event.stopPropagation();toggleNote('${c}')">✕</button></div>`}).join("")+`<div class="ctl"><button class="pill blue" onclick="notes.length>=4?openQuizWords(notes,'sổ tay'):toast('Cần ít nhất 4 từ để ôn')">🎯 Ôn tập sổ tay</button></div>`:`<p style="margin-top:14px" class="muted">Chưa có chữ nào. Mở một chữ và bấm “Lưu sổ tay”.</p>`}`);
}

/* search */
const qi=$("#q"),dr=$("#drop");let sel=0,res=[];
function search(t){
  t=t.trim();if(!t)return[];const tp=plain(t),tl=strip(t);
  return DICT.map((d,i)=>{let s=0;
    if(t.includes(d.c))s=100;
    else if(plain(d.py)===tp)s=90;else if(tp&&plain(d.py).startsWith(tp))s=70;
    else if(strip(d.hv)===tl)s=85;else if(tl.length>1&&strip(d.hv).startsWith(tl))s=60;
    else if(d.defs.some(f=>strip(f.vi).includes(tl)||f.en.toLowerCase().includes(tl)))s=40;
    else if(d.words.some(w=>w[0].includes(t)||strip(w[2]).includes(tl)))s=20;
    return [s,i]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]).slice(0,10);
}
function searchV(t){t=t.trim();if(!t)return[];const tp=plain(t),tl=strip(t);const out=[];

function openTranslate(){buildLex();openModal(`<h3>🔤 Dịch – tra nghĩa từng từ</h3><p class="muted">Dán câu tiếng Trung, app tách từ và hiện pinyin, nghĩa. Bấm vào từ để nghe.</p>

  <div class="ctl"><button class="pill" onclick="speak($('#trIn').value)">${ICO_SP} Nghe cả câu</button></div><div class="trout" id="trOut"></div>
  <div class="note">Dịch theo từ điển HSK 1 có sẵn; từ ngoài dữ liệu hiện mờ.</div>`);doTr()}
function doTr(){
  const t=$("#trIn").value;let out="",i=0;
  while(i<t.length){let f=null;for(let L=4;L>=1;L--){const w=t.substr(i,L);if(LEX[w]){f=w;break}}
    if(f){const x=LEX[f];out+=`<div class="trw" onclick="${wordHref(f)?`closeModal();goWord('${f}')`:`speak('${f}')`}"><small style="color:var(--cyan)">${x.py}</small><span class="hz">${f}</span><small>${esc(x.m||"")}</small></div>`;i+=f.length}
    else{const ch=t[i];if(/[一-鿿]/.test(ch))out+=`<div class="trw unk" onclick="speak('${ch}')"><small>?</small><span class="hz">${ch}</span><small>chưa có</small></div>`;else if(ch.trim())out+=`<span class="hz" style="align-self:center;font-size:22px">${esc(ch)}</span>`;i++}}
  $("#trOut").innerHTML=out;
}

/* radicals page */
function renderRadicals(){
  const g={};DICT.forEach(d=>{(g[d.rad[0]]=g[d.rad[0]]||{r:d.rad,cs:[]}).cs.push(d.c)});
  const list=Object.values(g).sort((a,b)=>b.cs.length-a.cs.length);
  $("#app").innerHTML=`<div class="hhead"><div><h1>🧩 Bộ thủ</h1><p>${list.length} bộ thủ xuất hiện trong ${DICT.length} chữ HSK 1 · bấm vào chữ để học</p></div></div>
  <div class="radg">${list.map(x=>`<div class="card radc"><div class="top2"><span class="hz">${x.r[0]}</span><div><b>Bộ ${x.r[1]}</b><div class="muted">${x.r[2]} · ${esc(x.r[3])}</div></div></div><div class="chs">${x.cs.map(c=>`<span onclick="go('c-${IDX[c]}')">${c}</span>`).join("")}</div></div>`).join("")}</div>`;
  document.title="Bộ thủ – Hán Tự Việt";
}

/* thanh menu trượt ngang */
function r2s(d){const r=$("#row2");r.scrollBy({left:d*Math.max(200,r.clientWidth*.6)})}
function r2upd(){const r=$("#row2");if(!r)return;$(".r2btn.l").classList.toggle("on",r.scrollLeft>4);$(".r2btn.r").classList.toggle("on",r.scrollLeft+r.clientWidth<r.scrollWidth-4)}
(function(){const r=$("#row2");
  r.addEventListener("scroll",()=>{r2upd();document.activeElement&&r.contains(document.activeElement)&&document.activeElement.blur()},{passive:true});
  r.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&r.scrollWidth>r.clientWidth){r.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  const place=dd=>{const b=dd.getBoundingClientRect(),m=dd.querySelector(".ddm");if(!m)return;m.style.top=(b.bottom+4)+"px";m.style.left=Math.max(8,Math.min(b.left,innerWidth-(m.offsetWidth||240)-8))+"px"};
  r.addEventListener("mouseover",e=>{const dd=e.target.closest(".dd");if(dd)place(dd)});
  r.addEventListener("focusin",e=>{const dd=e.target.closest(".dd");if(dd)place(dd)});
  let down=false,sx=0,sl=0,moved=false;
  r.addEventListener("mousedown",e=>{down=true;moved=false;sx=e.pageX;sl=r.scrollLeft});
  addEventListener("mouseup",()=>{down=false});
  r.addEventListener("mousemove",e=>{if(!down)return;const dx=e.pageX-sx;if(Math.abs(dx)>5){moved=true;r.style.scrollBehavior="auto";r.scrollLeft=sl-dx}});
  r.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;r.style.scrollBehavior=""}},true);
  addEventListener("resize",r2upd);
})();

/* misc */
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1800)}
function toggleTheme(){const l=document.documentElement.dataset.theme==="light";document.documentElement.dataset.theme=l?"dark":"light";store.set("theme",l?"dark":"light");$("#themeBtn").textContent="☀️";if(cur()>=0&&state.tab===3)renderTab(cur())}
(function(){const t=store.get("theme","dark");document.documentElement.dataset.theme=t;$("#themeBtn").textContent="☀️";calcStreak();renderAuth();updBadge();render()})();
</script>
